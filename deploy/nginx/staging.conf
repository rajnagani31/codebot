server {
    listen 80;
    server_name nerotechnology.online www.nerotechnology.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nerotechnology.online www.nerotechnology.online;

    ssl_certificate /etc/letsencrypt/live/nerotechnology.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nerotechnology.online/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        gzip off;
    }
}

server {
    listen 80;
    server_name api.nerotechnology.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.nerotechnology.online;

    ssl_certificate /etc/letsencrypt/live/nerotechnology.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nerotechnology.online/privkey.pem;

    location = / {
        return 302 /docs;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        gzip off;
    }
}
