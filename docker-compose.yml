# Local development compose stack.
# Use `docker-compose.staging.yml` together with this file on the server.
services:

  # ── PostgreSQL (+ pgvector extension) ────────────────────────
  db: # namy say as service called -> db, valkey, vector_db, backend, frontend etc ..
    image: pgvector/pgvector:pg16
    container_name: codebot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codebot
    ports:
      - "5433:5432" # defuault ports is 5432 but machine port is 5433 to avoid conflict with any local Postgres instance and apprun on localhost:5432
    volumes:
      - pg_data:/var/lib/postgresql/data # store database data in a Docker volume for persistence -> Without this → data is lost when container stops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Redis (Celery broker/result backend + token cache) ─────────
  redis:
    image: redis:7-alpine
    container_name: codebot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck: # Docker check Db is ready or not, tries every 5 secounds, if not ready after 5 retries → mark as unhealthy
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Qdrant (vector database) ───────────────────────────────────
  vector_db:
    image: qdrant/qdrant:v1.13.2  # This is a image with the latest stable Qdrant version as of June 2024
    container_name: codebot-qdrant # This is a container name for the Qdrant service, used for easy reference in other services
    ports: 
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Backend (FastAPI + uvicorn) ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codebot-backend
    env_file:
      - .env
    volumes:
      - ./keys:/app/keys:ro
    environment:
      # Override localhost defaults to point at Docker service names
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/codebot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_HOST: vector_db
      QDRANT_PORT: "6333"
      QDRANT_URL: http://vector_db:6333
      AUTO_CREATE_SCHEMA: "true"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vector_db:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ── Frontend (React + nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: codebot-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codebot-celery-worker
    env_file:
      - .env
    volumes:
      - ./keys:/app/keys:ro
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/codebot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_HOST: vector_db
      QDRANT_PORT: "6333"
      QDRANT_URL: http://vector_db:6333
    command: celery -A apps.backend.bot.application.core.celery:celery_app worker --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  qdrant_data:
